---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: default
spec:
  selector:
    matchLabels:
      app: etcd
  serviceName: etcd
  replicas: 1
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app: etcd
    spec:
      terminationGracePeriodSeconds: 10
      hostNetwork: true
      containers:
        - name: etcd-server
          image: registry.k8s.io/etcd:3.6.4-0
          command:
          - /usr/local/bin/etcd
          env:
            - name: ETCD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CLIENT_PORT
              value: "22379"
            - name: PEER_PORT
              value: "22380"
            - name: ETCD_INITIAL_ADVERTISE_PEER_URLS
              value: http://$(ETCD_NAME).etcd.default.svc.cluster.local:$(PEER_PORT)
            - name: ETCD_LISTEN_PEER_URLS
              value: "http://0.0.0.0:$(PEER_PORT)"
            - name: ETCD_LISTEN_CLIENT_URLS
              value: "http://0.0.0.0:$(CLIENT_PORT)"
            - name: ETCD_ADVERTISE_CLIENT_URLS
              value: "https://$(ETCD_NAME).etcd:$(CLIENT_PORT)"
            - name: ETCD_INITIAL_CLUSTER_TOKEN
              value: "etcd-cluster-1"
            - name: ETCD_INITIAL_CLUSTER
              value: "etcd-0=http://etcd-0.etcd.default.svc.cluster.local:$(PEER_PORT)"
            - name: ETCD_INITIAL_CLUSTER_STATE
              value: "new"
            - name: ETCD_DATA_DIR
              value: "/var/etcd/data"
          ports:
            - containerPort: 22379
              name: client
              protocol: TCP
            - containerPort: 22380
              name: peer
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: client
          livenessProbe:
            httpGet:
              path: /livez
              port: client
          volumeMounts:
            - name: data
              mountPath: /var/etcd/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: premium-rwo
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
